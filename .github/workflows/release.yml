name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: plugin zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Stage versioned plugins
        run: pnpm exec tsx scripts/build-plugins.ts --version "${GITHUB_REF_NAME}"
      - name: Zip plugin assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$VERSION"
          (cd dist/plugin-staging/chatgpt && zip -r "../../dilly-dally-chatgpt-${VERSION}.zip" .)
          (cd dist/plugin-staging/claude && zip -r "../../dilly-dally-claude-${VERSION}.zip" .)
          ls -la dist/*.zip
          unzip -l "dist/dilly-dally-chatgpt-${VERSION}.zip"
          unzip -l "dist/dilly-dally-claude-${VERSION}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-zips
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: plugin-zips
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes "dist/dilly-dally-chatgpt-${VERSION}.zip#Dilly Dally ChatGPT plugin" "dist/dilly-dally-claude-${VERSION}.zip#Dilly Dally Claude plugin"
